`<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --evergreen-green: #035211;
      --evergreen-gold: #f3c100;
    }
    .bg-evergreen-green { background-color: var(--evergreen-green); }
    .bg-evergreen-gold { background-color: var(--evergreen-gold); }
    .text-evergreen-green { color: var(--evergreen-green); }
    .text-evergreen-gold { color: var(--evergreen-gold); }
    .border-evergreen-green { border-color: var(--evergreen-green); }
    .border-evergreen-gold { border-color: var(--evergreen-gold); }
  </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-evergreen-green text-white shadow-lg sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-evergreen-gold tracking-wide">
          Evergreen Athletics Old Gym Banners
        </h1>
        <p class="text-sm text-gray-200">Online Auction</p>
      </div>
      
      <!-- Search & Filters -->
      <div class="flex flex-wrap gap-2 w-full md:w-auto">
        <input type="text" id="searchInput" oninput="filterBanners()" placeholder="Search sport, year..." 
          class="px-3 py-2 rounded text-gray-800 text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 flex-1 md:w-64">
        <select id="sportFilter" onchange="filterBanners()" class="px-3 py-2 rounded text-gray-800 text-sm focus:outline-none">
          <option value="">All Sports</option>
        </select>
      </div>
    </div>
  </header>

  <!-- Countdown Timer Banner -->
  <div id="auctionBanner" class="bg-amber-400 text-evergreen-green font-bold text-center py-3 px-4 shadow-md flex flex-wrap items-center justify-center gap-3">
    <span class="text-sm md:text-base">⏳ Auction Closes: <span id="auctionEndTimeText">Loading...</span></span>
    <div id="timerContainer" class="bg-evergreen-green text-evergreen-gold px-3 py-1 rounded-md text-sm font-mono tracking-wide">
      <span id="countdown">Calculating...</span>
    </div>
  </div>

  <!-- Banner Grid -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div id="loading" class="text-center py-20">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-evergreen-green border-t-evergreen-gold"></div>
      <p class="mt-4 text-gray-600 font-medium">Loading auction items...</p>
    </div>

    <div id="bannerGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 hidden"></div>
  </main>

  <!-- Full-Screen Image Lightbox Modal -->
  <div id="imageModal" class="fixed inset-0 bg-black bg-opacity-90 hidden z-50 flex items-center justify-center p-4 cursor-pointer" onclick="closeImageModal()">
    <button onclick="closeImageModal()" class="absolute top-4 right-6 text-white text-4xl font-bold hover:text-amber-400 z-50">&times;</button>
    <div class="relative max-w-full max-h-full flex flex-col items-center justify-center p-2" onclick="event.stopPropagation()">
      <img id="imageModalSrc" src="" alt="Banner Preview" class="max-h-[85vh] max-w-[90vw] object-contain rounded shadow-2xl">
      <p id="imageModalCaption" class="text-white text-center mt-3 font-semibold text-base"></p>
    </div>
  </div>

  <!-- Modal Form -->
  <div id="bidModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl relative">
      <button onclick="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
      
      <h2 class="text-xl font-bold text-evergreen-green mb-1" id="modalTitle">Place Bid</h2>
      <p class="text-xs text-gray-500 mb-4" id="modalSub"></p>

      <form id="bidForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="modalBannerId">

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Your Bid Amount ($)</label>
          <input type="number" step="5" id="bidAmount" required class="w-full border rounded px-3 py-2 text-lg font-bold text-evergreen-green focus:outline-none focus:border-evergreen-green">
          <p class="text-xs text-gray-500 mt-1" id="modalMinHelp"></p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Full Name</label>
          <input type="text" id="bidderName" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:border-evergreen-green">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Email Address</label>
          <input type="email" id="bidderEmail" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:border-evergreen-green">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase tracking-wider mb-1">Phone Number</label>
          <input type="tel" id="bidderPhone" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:border-evergreen-green">
        </div>

        <p class="text-xs text-gray-400 bg-gray-50 p-2 rounded">
          🔒 Your contact details are kept strictly private and used only to notify winning bidders.
        </p>

        <div id="modalAlert" class="hidden text-xs p-3 rounded font-medium"></div>

        <button type="submit" id="submitBtn" class="w-full bg-evergreen-green text-evergreen-gold font-bold py-3 rounded hover:bg-emerald-900 transition shadow">
          Confirm Bid
        </button>
      </form>
    </div>
  </div>

  <script>
    // =========================================================
    // ⚙️ CONFIGURATION
    // =========================================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzMZkwzlaxMGBS8YmC9MtVCfYcU0pA6Mew0PmTY4XHOH6iFm5peTeQPO1ngf5dlL-_3/exec";
    const AUCTION_END_DATE = new Date("2026-11-20T20:00:00"); 

    let allBanners = [];
    let isAuctionEnded = false;

    // Load data on start
    window.onload = function() {
      initCountdown();
      fetchBanners();
    };

    function initCountdown() {
      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short' };
      document.getElementById('auctionEndTimeText').innerText = AUCTION_END_DATE.toLocaleDateString('en-US', options);

      function updateTimer() {
        const now = new Date().getTime();
        const distance = AUCTION_END_DATE.getTime() - now;

        if (distance <= 0) {
          isAuctionEnded = true;
          document.getElementById('auctionBanner').className = "bg-red-600 text-white font-bold text-center py-3 px-4 shadow-md";
          document.getElementById('auctionBanner').innerHTML = "🚨 THIS AUCTION HAS OFFICIALLY CLOSED. NO MORE BIDS ARE BEING ACCEPTED.";
          filterBanners();
          return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById('countdown').innerText = `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }

      updateTimer();
      setInterval(updateTimer, 1000);
    }

    function fetchBanners() {
  fetch(GAS_API_URL, {
    method: "GET",
    redirect: "follow"
  })
  .then(res => res.json())
  .then(data => renderBanners(data))
  .catch(err => alert("Error loading data: " + err));
}

    function renderBanners(data) {
  // If data is wrapped in an object or null, fallback to empty array
  allBanners = Array.isArray(data) ? data : (data.banners || []);
  
  document.getElementById('loading').classList.add('hidden');
  const grid = document.getElementById('bannerGrid');
  grid.classList.remove('hidden');

  if (allBanners.length === 0) {
    grid.innerHTML = '<p class="text-center col-span-full text-gray-500 py-8">No auction banners found.</p>';
    return;
  }

  const sports = [...new Set(allBanners.map(b => b.sport))].sort();
  const sportSelect = document.getElementById('sportFilter');
  sportSelect.innerHTML = '<option value="">All Sports</option>' + 
    sports.map(s => `<option value="${s}">${s}</option>`).join('');

  filterBanners();
}

    function filterBanners() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sport = document.getElementById('sportFilter').value;

      const filtered = allBanners.filter(b => {
        const matchesSearch = b.sport.toLowerCase().includes(search) || 
                              String(b.year).includes(search) || 
                              b.title.toLowerCase().includes(search);
        const matchesSport = !sport || b.sport === sport;
        return matchesSearch && matchesSport;
      });

      const grid = document.getElementById('bannerGrid');
      grid.innerHTML = filtered.map(b => `
        <div class="bg-white rounded-lg shadow hover:shadow-md transition overflow-hidden border border-gray-200 flex flex-col justify-between">
          <div>
            <!-- Clickable Image Container -->
            <div class="relative group cursor-pointer overflow-hidden bg-gray-100" onclick="openImageModal('${b.imageUrl}', '${b.year} ${b.sport} - ${b.title}')">
              <img src="${b.imageUrl}" alt="${b.title}" class="w-full h-56 object-cover transition-transform duration-300 group-hover:scale-105">
              <div class="absolute inset-0 bg-black bg-opacity-0 group-hover:bg-opacity-30 transition-all flex items-center justify-center">
                <span class="text-white text-xs font-bold bg-black bg-opacity-70 px-3 py-1.5 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                  🔍 Click to enlarge
                </span>
              </div>
            </div>

            <div class="p-4">
              <div class="flex justify-between items-start gap-2 mb-1">
                <span class="text-xs font-semibold bg-emerald-100 text-evergreen-green px-2 py-0.5 rounded">${b.sport}</span>
                <span class="text-xs font-bold text-gray-500">${b.year}</span>
              </div>
              <h3 class="font-bold text-gray-800 text-base leading-tight">${b.title}</h3>
            </div>
          </div>

          <div class="p-4 pt-0 border-t border-gray-100 mt-2 bg-gray-50 flex items-center justify-between">
            <div>
              <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Current High Bid</p>
              <p class="text-xl font-extrabold text-evergreen-green">$${Number(b.currentHighBid).toFixed(2)}</p>
            </div>
            ${
              isAuctionEnded 
              ? `<button disabled class="bg-gray-300 text-gray-500 px-3 py-2 rounded font-bold text-xs cursor-not-allowed">Closed</button>`
              : `<button onclick="openBidModal('${b.id}')" class="bg-evergreen-green text-evergreen-gold px-4 py-2 rounded font-bold text-sm hover:bg-emerald-900 transition shadow">Place Bid</button>`
            }
          </div>
        </div>
      `).join('');
    }

    // Image Modal Functions
    function openImageModal(imgUrl, titleText) {
      document.getElementById('imageModalSrc').src = imgUrl;
      document.getElementById('imageModalCaption').innerText = titleText;
      document.getElementById('imageModal').classList.remove('hidden');
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.add('hidden');
      document.getElementById('imageModalSrc').src = '';
    }

    function openBidModal(id) {
      if (isAuctionEnded) return;

      const banner = allBanners.find(b => b.id === id);
      if (!banner) return;

      const currentBidNum = Number(banner.currentHighBid);
      const nextMinBid = currentBidNum === 0 ? 5 : (Math.floor(currentBidNum / 5) + 1) * 5;

      document.getElementById('modalBannerId').value = banner.id;
      document.getElementById('modalTitle').innerText = `${banner.year} ${banner.sport}`;
      document.getElementById('modalSub').innerText = banner.title;
      document.getElementById('modalMinHelp').innerText = `Bids must be in $5 increments (Minimum next bid: $${nextMinBid.toFixed(2)})`;
      
      const bidInput = document.getElementById('bidAmount');
      bidInput.step = "5";
      bidInput.value = nextMinBid.toFixed(2);
      bidInput.min = nextMinBid.toFixed(2);

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.classList.remove('hidden');
      submitBtn.disabled = false;
      submitBtn.innerText = "Confirm Bid";

      document.getElementById('modalAlert').classList.add('hidden');
      document.getElementById('bidModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('bidModal').classList.add('hidden');
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      if (isAuctionEnded) {
        alert("The auction has ended.");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('modalAlert');

      submitBtn.disabled = true;
      submitBtn.innerText = "Submitting...";

      const payload = {
        bannerId: document.getElementById('modalBannerId').value,
        bidAmount: document.getElementById('bidAmount').value,
        name: document.getElementById('bidderName').value,
        email: document.getElementById('bidderEmail').value,
        phone: document.getElementById('bidderPhone').value
      };

      fetch(GAS_API_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Confirm Bid";

        alertBox.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700');
        if (res.success) {
          alertBox.classList.add('bg-green-100', 'text-green-700');
          alertBox.innerText = res.message;
          
          submitBtn.classList.add('hidden');
          fetchBanners(); 
        } else {
          alertBox.classList.add('bg-red-100', 'text-red-700');
          alertBox.innerText = res.message;
        }
      })
      .catch(err => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Confirm Bid";
        alertBox.classList.remove('hidden');
        alertBox.classList.add('bg-red-100', 'text-red-700');
        alertBox.innerText = "Error submitting bid. Please try again.";
      });
    }
  </script>
</body>
</html>
